<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    margin: 0;
    background: #fdebed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: #ffd6df;
    width: 90%;
    max-width: 900px;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    animation: fadeIn 0.8s ease;
}

h1, h2, h3 {
    color: #4a1c2f;
}

p {
    color: #5c3a44;
}

.buttons {
    margin-top: 30px;
    position: relative;
    height: 90px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 50px;
    padding: 15px 40px;
    font-size: 18px;
    color: white;
    transition: all 0.3s ease;
    position: absolute;
}

#yesBtn {
    background: red;
    left: 30%;
    z-index: 2;
}

#noBtn {
    background: #2b2bff;
    right: 30%;
    z-index: 1;
}

.hidden {
    display: none;
}

/* Gifts */
.gifts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.gift {
    background: #ffe9ee;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: transform 0.3s;
}

.gift:hover {
    transform: scale(1.05);
}

.gift-content {
    margin-top: 25px;
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    text-align: left;
}

/* Quiz */
.quiz label {
    display: block;
    margin-bottom: 8px;
    cursor: pointer;
}

/* Photos */
.photos {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.photos img {
    width: 100%;
    border-radius: 10px;
}

/* Popup */
.popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.popup-box {
    background: #ffe6ef;
    padding: 35px 45px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.popup-box button {
    position: static;
    margin-top: 20px;
    background: red;
}

/* Animations */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">
    <h1 id="questionText">Will you be mine 🥺?</h1>
    <p>Life is an incredible journey, and I want to spend every single second of it with you.</p>

    <div class="buttons">
        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="card hidden" id="page2">
    <h1>Happy Valentine’s Day Baby ❤️💍</h1>
    <p>Every second with you is a celebration. You make my world brighter.</p>

    <h2>Something for You 💝</h2>

    <div class="gifts">
        <div class="gift" onclick="openGift(1)">🎁 Gift 1</div>
        <div class="gift" onclick="openGift(2)">💌 Gift 2</div>
        <div class="gift" onclick="openGift(3)">🖼 Gift 3</div>
    </div>

    <div id="giftContent" class="gift-content hidden"></div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");
const questionText = document.getElementById("questionText");

let scale = 1;
let clickCount = 0;

const questions = [
    "Are you sure 😠?",
    "Think again 😤",
    "Don’t break my heart 💔",
    "Last chance 😭"
];

noBtn.addEventListener("click", () => {
    scale += 0.4;
    yesBtn.style.transform = `scale(${scale})`;
    questionText.innerText = questions[Math.min(clickCount, questions.length - 1)];
    clickCount++;
});

yesBtn.addEventListener("click", () => {
    page1.classList.add("hidden");
    page2.classList.remove("hidden");
});

function openGift(num) {
    const content = document.getElementById("giftContent");
    content.classList.remove("hidden");

    if (num === 1) {
        content.innerHTML = `
            <h3>💖 Relationship Quiz</h3>
            <div class="quiz">
                <p><strong>1. How did we first meet?</strong></p>
                <label><input type="radio" name="q1"> College</label>
                <label><input type="radio" name="q1"> Apps Uk🫦</label>
                <label><input type="radio" name="q1"> Mutual Friends</label>

                <p><strong>2. Who falls asleep first on calls or chats?</strong></p>
                <label><input type="radio" name="q2"> You 😴</label>
                <label><input type="radio" name="q2"> Me 😌</label>
                <label><input type="radio" name="q2"> Both 🥹</label>

                <p><strong>3. What keeps us strongest?</strong></p>
                <label><input type="radio" name="q3"> Love ❤️</label>
                <label><input type="radio" name="q3"> Trust 🤝</label>
                <label><input type="radio" name="q3"> Everything 💕</label>

                <br>
                <button onclick="submitQuiz()" style="
                    background:red;
                    color:white;
                    padding:10px 30px;
                    border:none;
                    border-radius:30px;
                    font-size:16px;
                    position: static;">
                    Submit 💌
                </button>
            </div>
        `;
    }

    if (num === 2) {
        content.innerHTML = `
            <h3>💌 Love Letter</h3>
            <p>
                My love,<br><br>
                You are my happiness, my peace, my forever.
                Every laugh, every tear, every moment with you
                makes my life more beautiful ❤️<br><br>
                I choose you. Always.
            </p>
        `;
    }

    if (num === 3) {
        content.innerHTML = `
            <h3>🖼 Our Memories</h3>
            <div class="photos">
                <img src="8a018f30-b596-4b2c-94b7-e29b8bbdaa17.JPG">
                <img src="19f9c2af-78ce-4446-a3d6-a7285f04ccd8.JPG">
                <img src="66f12921-501d-4265-a3ed-6f4e0492f0c1.JPG">
                <img src="1269a039-6c9d-414f-b9c7-445063485a6d.jpg">
                <img src="124799a3-9807-4276-963c-0e414c3e1d6d.JPG">
                <img src="ef3d46d9-8358-4a09-88f8-321d35c8918f.JPG">
            </div>
            <p>Hope you Love this!❤️</p>
        `;
    }
}

function submitQuiz() {
    const popup = document.createElement("div");
    popup.className = "popup";
    popup.innerHTML = `
        <div class="popup-box">
            <h2>Thank you soooo muchhhh 💖🥹</h2>
            <button onclick="this.parentElement.parentElement.remove()">OK ❤️</button>
        </div>
    `;
    document.body.appendChild(popup);
}
</script>

</body>
</html>
